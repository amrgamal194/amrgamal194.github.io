<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">AG</title>
  <desc id="desc">Amr Gamal initials in a blue and purple mark</desc>
  <defs>
    <linearGradient id="background" x1="8" y1="6" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#123b82"/>
      <stop offset="0.55" stop-color="#253a91"/>
      <stop offset="1" stop-color="#6b2fa1"/>
    </linearGradient>
    <linearGradient id="letters" x1="16" y1="14" x2="50" y2="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#dbeafe"/>
      <stop offset="0.55" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="17" fill="#020817"/>
  <rect x="3" y="3" width="58" height="58" rx="15" fill="url(#background)" stroke="#93c5fd" stroke-opacity=".45" stroke-width="2"/>
  <circle cx="17" cy="14" r="12" fill="#60a5fa" fill-opacity=".18" filter="url(#glow)"/>
  <circle cx="50" cy="51" r="13" fill="#c084fc" fill-opacity=".2" filter="url(#glow)"/>
  <text x="32" y="42" fill="url(#letters)" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="800" letter-spacing="-2" text-anchor="middle">AG</text>
</svg>
